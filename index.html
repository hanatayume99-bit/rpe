<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미연과 수아</title>
  <style>
    body {
      background: #1a1a1a;
      color: #eee;
      font-family: 'Malgun Gothic', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #game {
      width: 800px;
      max-width: 95%;
      background: #2b2b2b;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }
    #speaker {
      color: #ff9ecb;
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 15px;
      min-height: 1.5em;
    }
    #text {
      font-size: 1.15em;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 200px;
      margin-bottom: 25px;
    }
    #nextBtn {
      background: #ff6b9d;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    #nextBtn:hover {
      background: #ff4d88;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="speaker"></div>
    <div id="text">로딩 중...</div>
    <button id="nextBtn">다음 ▶</button>
  </div>

  <script>
    const scenes = [
      {
        speaker: "",
        text: "시골 마을 오후.\n미연은 김을 매다가 허리를 펼치며 숨을 골랐다.\n그때 뒤에서 거친 손이 갑자기 입을 틀어막았다."
      },
      {
        speaker: "미연",
        text: "「읍…!」"
      },
      {
        speaker: "",
        text: "남자는 이미 그녀의 허리를 팔로 꽉 감아쥐고 있었다.\n미연은 발버둥 쳤지만 상대의 힘에 완전히 제압당했다.\n그대로 끌려가 헛간 안으로 던져졌다."
      },
      {
        speaker: "",
        text: "문이 닫히고, 남자가 미연의 저고리를 거칠게 잡아뜯었다.\n단추들이 튕겨 나가고 땀에 젖은 속옷이 드러났다.\n미연이 가슴을 가리려 하자 손목을 한 손으로 붙잡고 위로 올렸다."
      },
      {
        speaker: "",
        text: "남자는 치마를 걷어올리고 속옷을 옆으로 젖힌 뒤,\n이미 단단하게 발기한 대물을 미연의 다리 사이에 갖다 댔다.\n축축하게 움츠러든 보지 입구가 억지로 벌어지며 미연의 허리가 움찔했다."
      },
      {
        speaker: "미연",
        text: "「아…! 너무… 커…」"
      },
      {
        speaker: "",
        text: "남자는 한 번에 깊이 들어가지 않았다.\n조금씩 밀고, 빼고, 다시 조금 더 깊이 밀어 넣는 것을 반복했다.\n미연의 보지가 서서히 벌어지며 통증이 밀려왔다.\n그러나 남자는 서두르지 않았다.\n오랜 시간 동안 천천히, 깊게, 반복해서 그녀의 보지를 벌렸다."
      },
      {
        speaker: "",
        text: "시간이 흐를수록 미연의 몸이 미묘하게 변하기 시작했다.\n처음엔 순수한 고통과 거부감뿐이었는데,\n대물이 보지 안쪽을 문지르고 압박할 때마다 이상한 열기가 피어올랐다.\n허벅지 안쪽이 축축해지고, 원하지 않는 신음이 새어 나왔다."
      },
      {
        speaker: "미연",
        text: "「아… 하아… 그만… 보지… 이상해…」"
      },
      {
        speaker: "",
        text: "남자는 미연을 뒤집어서 뒤로 삽입하기도 하고,\n다시 눕혀서 다리를 벌리고 깊이 박아 넣기도 했다.\n헛간 안에서 살이 부딪히는 소리가 끊임없이 울렸다.\n미연의 보지는 처음엔 고통스러웠지만, 시간이 지날수록 조금씩 물기 시작하며 대물을 감싸안았다."
      },
      {
        speaker: "",
        text: "남자는 꽤 오랜 시간 동안 미연의 보지를 범했다.\n중간에 한 번 사정한 뒤에도 빼지 않고 다시 움직이기 시작했고,\n미연의 보지는 정액과 애액이 섞여 질척거렸다.\n두 번째 사정 때 남자는 깊게 박아 넣은 채 정액을 보지 안쪽에 쏟아부었다.\n미연의 몸이 크게 떨렸다."
      },
      {
        speaker: "",
        text: "남자가 빠져나가자, 미연의 다리 사이로 흘러나온 액이 허벅지를 타고 흘러내렸다.\n벌어진 보지에서 정액이 질질 흘러내리는 모습이 적나라했다.\n그녀는 바닥에 주저앉아 한참 동안 숨을 고르며,\n자신의 보지가 이상하게 달아올라 있는 것을 느꼈다."
      },
      // ===== 심문실 시작 =====
      {
        speaker: "",
        text: "며칠 후.\n좁고 습한 심문실.\n미연은 가죽 수갑에 묶인 채 의자에 앉아 있었고,\n철창 너머로 수아가 보였다."
      },
      {
        speaker: "",
        text: "수아는 상의가 벗겨진 채 여러 형사에게 둘러싸여 있었지만,\n실제로 삽입하는 것은 한 명의 형사뿐이었다.\n그 형사는 수아의 다리를 양손으로 강하게 벌린 뒤,\n아직 한 번도 열린 적 없는 처녀 보지에 대물을 천천히 밀어 넣었다."
      },
      {
        speaker: "수아",
        text: "「아악…! 빼 주세요… 제발… 보지… 아파요…」"
      },
      {
        speaker: "",
        text: "처녀막이 찢어지는 순간 수아의 허리가 크게 경련했고,\n피와 애액이 섞인 액이 흘러내렸다.\n형사는 표정 하나 바꾸지 않고, 자신의 페이스대로 아주 천천히, 깊게 수아의 처녀 보지를 벌려 나갔다."
      },
      {
        speaker: "",
        text: "수아는 철창 너머로 엄마가 여러 명에게 당하는 모습을 강제로 봐야 했다.\n자신의 보지가 한 남자의 대물에 의해 반복적으로 파헤쳐지는 동안,\n엄마의 보지는 이미 여러 남자들에게 돌아가며 사용당하고 있었다.\n그 광경이 수아의 수치심을 배가시켰다."
      },
      {
        speaker: "",
        text: "형사는 수아를 여러 자세로 바꾸며 오랜 시간 동안 계속했다.\n뒤로 삽입할 때는 수아의 엉덩이를 세게 잡고 깊숙이 박아 넣었고,\n정면으로 넣을 때는 수아의 배가 대물의 형태로 미세하게 불룩해지는 것을 눈으로 확인했다.\n수아가 비자발적으로 보지를 조일 때마다,\n형사는 아무 말 없이 더 세게, 더 오래 움직였다."
      },
      {
        speaker: "",
        text: "결국 형사는 깊게 박아 넣은 채 정액을 수아의 보지 안쪽에 쏟아부었다.\n수아의 배가 순간적으로 뜨거워지는 감각에 그녀는 크게 몸을 떨었다.\n벌어진 처녀 보지에서 피와 정액이 섞여 흘러내렸다."
      },
      // ===== 미연 다인 =====
      {
        speaker: "",
        text: "미연은 넓은 방에 끌려갔다.\n수갑이 채워진 상태로 바닥에 무릎을 꿇고 있자,\n문이 열리며 남자들이 들어왔다.\n심문관을 포함해 열두 명이 넘는 남자들이 미연을 둘러쌌다.\n모두 대물이었다."
      },
      {
        speaker: "",
        text: "가장 먼저 심문관이 미연의 입안으로 밀어 넣었다.\n동시에 뒤에서 다른 남자가 미연의 보지에 들어왔다.\n미연의 몸이 크게 흔들렸다.\n곧이어 양쪽 손에도 각각 대물이 쥐어졌고,\n미연은 입과 보지, 양손을 동시에 사용당하기 시작했다."
      },
      {
        speaker: "",
        text: "남자들은 교대하지 않았다.\n한 명이 사정하면 바로 다음 남자가 그 자리를 채웠다.\n미연의 보지는 이미 여러 남자의 정액으로 질척거렸고,\n입안과 손에도 끊임없이 새로운 대물이 들어왔다."
      },
      {
        speaker: "",
        text: "시간이 흐를수록 미연의 신체 반응은 더 노골적으로 변했다.\n처음엔 거부하며 몸을 경직시켰지만,\n10명이 넘는 남자들이 번갈아가며 그녀의 보지를 채우자\n허리가 제멋대로 들썩이고, 보지가 대물을 감지하는 순간마다 강하게 조여들었다.\n유두가 단단히 선 채로 흔들렸고,\n배가 경련하듯 떨릴 때마다 남자들 사이에서 비웃음이 터져 나왔다."
      },
      {
        speaker: "형사",
        text: "「이 년, 이제 보지로 그냥 받으면서 좋아하잖아.」\n「딸은 한 놈한테만 당하는데, 엄마 보지는 열 놈이 넘네.」"
      },
      {
        speaker: "",
        text: "미연은 고개를 저으려 했지만,\n이미 입은 막혀 있었고, 눈에서는 생리적인 눈물만 흘렀다.\n몸이 먼저 반응하고 있었다.\n대물이 보지 가장 깊은 곳을 두드릴 때마다 허벅지가 경련했고,\n조여드는 감각을 스스로 멈출 수 없었다."
      },
      {
        speaker: "",
        text: "그날 하루 동안 미연의 보지를 사용한 남자는 열네 명이었다.\n미연의 보지는 더 이상 누구의 것인지도 구분되지 않을 정도로\n여러 남자의 정액으로 가득 차 있었다.\n다리가 풀린 채 바닥에 주저앉자, 벌어진 보지에서 정액이 주르륵 흘러내렸다."
      },
      // ===== 엔딩 =====
      {
        speaker: "",
        text: "몇 달이 흘렀다.\n\n수아는 끝까지 그 이름 없는 형사 한 명에게만 보지를 내주며 배를 불렸다.\n미연은 10명이 넘는 남자들에게 반복적으로 보지를 사용당하며 배를 불렸다."
      },
      {
        speaker: "",
        text: "어느 날, 두 사람은 동시에 자신의 배를 내려다보았다.\n미연의 배는 이미 눈에 띄게 불러 있었고,\n수아의 배 역시 비슷한 정도로 불러 있었다."
      },
      {
        speaker: "심문관",
        text: "「딸은 한 놈 새끼고,\n엄마는… 열 명이 넘으니까 누구 새끼인지도 모르겠군.\n그래도 둘 다 보지에 동시에 생겼어.」"
      },
      {
        speaker: "",
        text: "미연과 수아는 아무 말도 하지 않았다.\n다만 서로의 불러오는 배를 바라보며,\n아주 오랜 시간 동안 자신들의 보지가 당해 온 결과가\n몸 안에 동시에 자라고 있다는 사실만을 확인하고 있었다."
      },
      {
        speaker: "",
        text: "문이 열리고,\n두 사람은 천천히 그 방을 나왔다.\n배 속에 새로운 생명을 동시에 품은 채로.\n\n— 끝 —"
      }
    ];

    let current = 0;

    function showScene() {
      const scene = scenes[current];
      document.getElementById("speaker").textContent = scene.speaker || "";
      document.getElementById("text").textContent = scene.text;
      
      if (current >= scenes.length - 1) {
        document.getElementById("nextBtn").textContent = "끝";
        document.getElementById("nextBtn").disabled = true;
      }
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (current < scenes.length - 1) {
        current++;
        showScene();
      }
    });

    // 키보드 스페이스/엔터로도 진행 가능하게
    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "Enter") {
        document.getElementById("nextBtn").click();
      }
    });

    showScene();
  </script>
</body>
</html>
